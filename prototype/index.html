<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Field Notes From the Blue</title>
<meta name="description" content="Field Notes From the Blue, Volume I: Whale Sharks. An illustrated, cited, five-minute interactive documentary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
:root{
  --abyss:#0a2233; --deep:#0e3246; --ocean:#1b5a72; --turq:#3f9c98; --sea:#5f977b; --foam:#d3e6e0;
  --paper:#f2eadb; --paper-2:#e7dcc4; --paper-3:#d6c6a4; --ink:#26282a; --ink-2:#47463f; --ink-3:#6a6558;
  --coral:#d2705a; --coral-ink:#a3452f; --gold:#cf9f45; --gold-2:#e8c67f; --teal-ink:#285c63;
  --on-deep:#eef3ef; --on-deep-2:#b9cdd0; --line-deep:rgba(214,231,229,.26);
  --focus:#ffd76a;
  --f-display:"IM Fell English","Iowan Old Style",Georgia,serif;
  --f-body:"Spectral",Georgia,"Times New Roman",serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --top:68px; --bot:128px; --gut:clamp(16px,3vw,36px);
  --paper-noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .29  0 0 0 0 .18  0 0 0 .11 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--abyss);color:var(--on-deep);font-family:var(--f-body);font-size:17px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
#root{height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.on-paper :focus-visible,.drawer :focus-visible{outline-color:#b3401f}
[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fallback{padding:40px 24px;max-width:36rem;margin:auto;font-family:var(--f-body)}

/* ---------- App frame ---------- */
.app{position:relative;height:100%;overflow:hidden;isolation:isolate}
.stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;animation:sceneIn .7s cubic-bezier(.2,.7,.2,1) both;scrollbar-width:thin}
.scene.back{animation-name:sceneBack}
.scene-inner{position:relative;z-index:2;min-height:100%;padding:var(--top) var(--gut) var(--bot)}
.particles{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.bg{position:absolute;inset:0;z-index:0;overflow:hidden}
.bg svg{width:100%;height:100%;display:block}

.topbar{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gut) 18px;background:linear-gradient(to bottom,rgba(7,25,38,.8),rgba(7,25,38,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.app.chrome-light .topbar{background:none;color:var(--ink)}
.wordmark{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.wordmark b{font-family:var(--f-display);font-weight:400;font-size:19px;white-space:nowrap}
.wordmark small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);margin-top:3px;white-space:nowrap}
.app.chrome-light .wordmark small{color:var(--coral-ink)}
.tools{display:flex;gap:8px;align-items:center}

.btn{font-family:var(--f-mono);font-size:12.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;min-height:44px;padding:0 16px;border-radius:3px;border:1px solid var(--line-deep);background:rgba(8,28,42,.45);color:var(--on-deep);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,border-color .2s,color .2s;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--gold-2)}
.btn[disabled]{opacity:.38;cursor:default}
.btn[disabled]:hover{border-color:var(--line-deep)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#1d1a12}
.btn-primary:hover{background:var(--gold-2);border-color:var(--gold-2)}
.btn-explore{border-color:rgba(232,198,127,.65);color:var(--gold-2);background:rgba(8,28,42,.55)}
.btn-explore:hover{background:rgba(207,159,69,.16)}
.btn[aria-pressed="true"]{background:rgba(207,159,69,.2);border-color:var(--gold-2);color:var(--gold-2)}
.app.chrome-light .topbar .btn{color:var(--ink);border-color:rgba(38,40,42,.35);background:rgba(242,234,219,.55)}
.app.chrome-light .topbar .btn:hover{border-color:var(--ink)}
.app.chrome-light .topbar .btn[aria-pressed="true"]{color:var(--coral-ink);border-color:var(--coral-ink)}
.on-paper .btn{color:var(--ink);border-color:rgba(38,40,42,.35);background:transparent}
.on-paper .btn:hover{border-color:var(--ink);background:rgba(38,40,42,.04)}
.on-paper .btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.on-paper .btn-primary:hover{background:#3b3d40}
.on-paper .btn[aria-pressed="true"]{background:rgba(210,112,90,.12);border-color:var(--coral-ink);color:var(--coral-ink)}
.lbl-short{display:none}

.dock{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:26px var(--gut) 12px;background:linear-gradient(to top,rgba(6,22,33,.95) 58%,rgba(6,22,33,0));display:grid;gap:6px}
.progress{display:flex;align-items:center;gap:16px;min-width:0}
.progress ol{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:0 1 420px;min-width:120px}
.progress li{flex:1}
.seg{display:block;width:100%;height:30px;padding:0;border:0;background:none;cursor:pointer}
.seg span{display:block;height:3px;border-radius:2px;background:rgba(214,231,229,.24);transition:background .3s}
.seg:hover span{background:rgba(214,231,229,.5)}
.seg.done span{background:var(--turq)}
.seg.current span{background:var(--gold);height:4px}
.progress-label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-deep-2);flex:1;min-width:0;overflow-wrap:anywhere}
.progress-label b{color:var(--on-deep);font-weight:500}
.linkbtn{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--gold-2);cursor:pointer;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;white-space:nowrap}
.navrow{display:flex;align-items:center;gap:10px}
.navrow .btn-explore{flex:1;max-width:360px;margin-inline:auto}
.navrow .btn-nav{min-width:104px}
.keyhint{font-family:var(--f-mono);font-size:11px;color:var(--on-deep-2);letter-spacing:.06em}

/* ---------- Type ---------- */
.kicker{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-2);margin:0 0 10px}
.display{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,5.4vw,68px);line-height:1.0;margin:0;text-wrap:balance;letter-spacing:-.005em}
.lede{font-size:clamp(16px,1.35vw,18.5px);max-width:36em;margin:12px 0 0;color:var(--on-deep-2)}
.hand{font-family:var(--f-hand);font-weight:500;line-height:1.1}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;display:inline-flex;align-items:center;gap:6px;padding:3px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;vertical-align:middle}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.doc{color:#2c6356}
.tag.open{color:var(--coral-ink)}
.tag.assess{color:#6d5520}
.tag.illus{color:var(--ink-3);border-style:dashed}
.tag.illus::before{background:none;border:1px dashed currentColor}
.dark .tag.illus,.tag.illus.dk{color:var(--on-deep-2)}
.cite{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em;background:none;border:0;padding:4px 0;margin:0 2px;color:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;opacity:.85;white-space:nowrap}
.cite:hover{opacity:1;text-decoration-style:solid}

/* ---------- Paper pages ---------- */
.deepbg{background:radial-gradient(120% 80% at 50% -10%,#1f5f72 0%,#123d53 40%,#0a2233 80%)}
.page{position:relative;max-width:1180px;margin:0 auto;background-color:var(--paper);background-image:var(--paper-noise),radial-gradient(60% 50% at 88% 12%,rgba(201,162,74,.10),transparent 70%),radial-gradient(40% 40% at 8% 92%,rgba(120,90,40,.08),transparent 70%),linear-gradient(90deg,rgba(80,60,30,.10),rgba(80,60,30,0) 26px);color:var(--ink);padding:clamp(18px,3vw,40px) clamp(18px,3.4vw,48px);box-shadow:0 30px 80px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.4) inset;border-radius:2px}
.page::after{content:"";position:absolute;inset:8px;border:1px solid rgba(90,70,40,.16);pointer-events:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:clamp(14px,2vw,24px)}
.page h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,3.6vw,46px);line-height:1.02;margin:0;text-wrap:balance}
.page .kicker{color:var(--coral-ink)}
.folio{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.page p{margin:0}
.page .body{font-size:16px;line-height:1.55;color:var(--ink-2);max-width:38em}
.figcap{font-size:13.5px;color:var(--ink-3);font-style:italic;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}

/* ---------- Scene 1 ---------- */
.s1 .bg svg{position:absolute;inset:0}
.s1-top{position:absolute;left:0;right:0;top:var(--top);height:calc(52% - var(--top));display:flex;align-items:center;justify-content:center;gap:clamp(22px,4.5vw,64px);padding:0 var(--gut);z-index:3}
.journal-wrap{position:relative;flex:none;width:clamp(170px,19vw,272px);animation:bob 7s ease-in-out infinite}
.journal{position:relative;aspect-ratio:3/4;perspective:1600px}
.jpage{position:absolute;inset:3% 2% 3% 3%;background-color:var(--paper);background-image:var(--paper-noise);border-radius:2px 6px 6px 2px;box-shadow:0 1px 0 #c9b88f,0 2px 0 #e2d6bb,0 3px 0 #c9b88f;padding:14% 12%;color:var(--ink);display:flex;flex-direction:column;gap:8px}
.jpage .hand{font-size:clamp(16px,1.6vw,22px);color:var(--teal-ink)}
.jpage hr{border:0;border-top:1px solid rgba(38,40,42,.25);width:60%;margin:4px 0}
.jcover{position:absolute;inset:0;transform-origin:0% 50%;transition:transform 1s cubic-bezier(.5,.05,.3,1);transform-style:preserve-3d;backface-visibility:hidden}
.journal.opening .jcover{transform:rotateY(-158deg)}
.ribbon{position:absolute;left:66%;bottom:-9%;width:9px;height:16%;background:linear-gradient(90deg,#b95a44,#d77a61 60%,#a8493a);clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);z-index:-1}
.jshadow{position:absolute;left:8%;right:8%;bottom:-16%;height:9%;background:radial-gradient(closest-side,rgba(20,50,60,.38),transparent);filter:blur(4px);animation:shadow 7s ease-in-out infinite}

.jc{--cover:#24514e;position:absolute;inset:0;border-radius:3px 7px 7px 3px;background-color:var(--cover);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.12),transparent 60%),linear-gradient(90deg,rgba(0,0,0,.35),rgba(0,0,0,0) 9%);box-shadow:0 18px 40px rgba(6,22,33,.45),inset 0 0 0 1px rgba(255,255,255,.06);color:var(--gold-2);padding:9% 9% 9% 13%;display:flex}
.jc-frame{flex:1;border:1px solid rgba(232,198,127,.7);outline:1px solid rgba(232,198,127,.35);outline-offset:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:10% 7% 8%}
.jc-series{font-family:var(--f-display);font-size:clamp(17px,1.9vw,26px);line-height:1.05;margin:0;color:var(--gold-2);font-weight:400}
.jc-series span{display:block;font-style:italic;font-size:.82em;margin-top:2px}
.jc-emblem{width:92%;height:auto;color:var(--gold-2);overflow:visible}
.jc-emblem .em-fill{fill:var(--cover)}
.jc-plate{background:var(--paper);background-image:var(--paper-noise);color:var(--ink);padding:7% 8%;width:94%;box-shadow:inset 0 0 0 1px rgba(38,40,42,.4),inset 0 0 0 3px var(--paper),inset 0 0 0 4px rgba(38,40,42,.25);display:flex;flex-direction:column;gap:1px}
.jc-vol{font-family:var(--f-mono);font-size:clamp(8.5px,.72vw,10px);letter-spacing:.2em;text-transform:uppercase;color:var(--coral-ink)}
.jc-name{font-family:var(--f-display);font-size:clamp(16px,1.6vw,22px);line-height:1.05}
.jc-sub{font-family:var(--f-display);font-style:italic;font-size:clamp(10px,.85vw,12.5px);color:var(--ink-2);line-height:1.2}
.s1-copy{max-width:25rem;color:var(--ink);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.s1-copy .kicker{color:var(--coral-ink);margin:0}
.s1-copy p.intro{margin:0;font-size:clamp(16px,1.3vw,18px);color:var(--ink-2)}
.s1-copy .hand{font-size:clamp(20px,1.9vw,26px);color:var(--teal-ink);margin:2px 0 0}
.s1 .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--paper);min-height:50px;padding:0 22px}
.s1 .btn-primary:hover{background:#3a3c3f}
.s1-shark{position:absolute;left:50%;top:59%;width:min(90vw,98vh,1180px);z-index:2;animation:cruise 46s ease-in-out infinite alternate}
.s1-shark .ws-fig{opacity:.8}
.s1-haze{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(20,82,98,0) 52%,rgba(18,70,88,.28) 70%,rgba(10,34,51,.55) 100%)}
.s1 .particles{z-index:2;top:52%;height:48%}

/* ---------- Whale-shark figure ---------- */
.ws-fig{position:relative;width:100%;aspect-ratio:1200/460;max-width:100%}
.ws-fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ws-anim{animation:glide 9s ease-in-out infinite}
.ws-anim .l-tail{transform-origin:78.4% 49.6%;animation:sway 5.2s ease-in-out infinite alternate}
.ws-anim .l-pec{transform-origin:29.4% 63%;animation:pec 6.4s ease-in-out infinite alternate}

/* ---------- Scene 2 ---------- */
.s2 .scene-inner{display:flex;flex-direction:column;gap:clamp(10px,2vh,24px)}
.s2-copy{max-width:44rem}
.statement{margin:16px 0 0;padding:2px 0 2px 18px;border-left:2px solid var(--coral);font-family:var(--f-display);font-style:italic;font-size:clamp(19px,2vw,27px);line-height:1.32;color:#e8f1ed;max-width:32em}
.statement p{margin:0}
.s2-figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.s2-stage{position:relative;width:min(100%,calc((100vh - 400px) * 1.94));min-width:min(100%,520px);margin:0 auto;aspect-ratio:1200/620}
.s2-stage .ws-fig{position:absolute;left:0;top:12.9%;width:100%}
.s2-stage>svg.over{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.s2-caption{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;max-width:1100px;margin:0 auto;width:100%}
.specimen{font-size:15px;color:var(--on-deep-2);max-width:40em;margin:0}
.specimen i{color:var(--on-deep);font-style:italic}
.scale-note{font-size:14.5px;color:var(--gold-2);margin:0;max-width:40em}
.fade-in{animation:fadeIn .5s ease both}

/* ---------- Scene 3 ---------- */
.grid-plate{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:start}
.plate-fig{position:relative;margin:0}
.plate-art{position:relative}
.plate-art>svg.labels{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.hot span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(242,234,219,.92);border:1.5px solid var(--coral-ink);color:var(--coral-ink);font-family:var(--f-display);font-size:17px;line-height:1;box-shadow:0 0 0 4px rgba(210,112,90,.18);transition:transform .2s,background .2s}
.hot:hover span{transform:scale(1.08)}
.hot[aria-pressed="true"] span{background:var(--coral-ink);color:var(--paper);box-shadow:0 0 0 6px rgba(210,112,90,.25)}
.hot-list{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px}
.hot-list .btn{min-height:40px;padding:0 12px;font-size:11.5px}
.note{border-top:1px solid rgba(38,40,42,.25);padding-top:14px}
.note-num{font-family:var(--f-display);font-size:15px;color:var(--coral-ink)}
.note h3{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,2.2vw,28px);margin:2px 0 8px;line-height:1.1}
.note p{font-size:16px;line-height:1.55;color:var(--ink-2)}
.demo{margin-top:22px;border-top:1px solid rgba(38,40,42,.25);padding-top:14px}
.demo h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 6px}
.demo canvas{display:block;width:100%;aspect-ratio:560/300;max-width:100%}
.demo-controls{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px}
.demo-controls .btn{min-height:40px;padding:0 12px;font-size:11.5px}
.counter{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-left:auto;font-variant-numeric:tabular-nums}
.step-text{font-size:15px;color:var(--ink-2);margin-top:8px!important;min-height:3em}

/* ---------- Scene 4 ---------- */
.grid-id{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3.4vw,52px);align-items:start}
.id-thumb{margin-top:18px;position:relative}
.id-thumb .ws-fig{max-width:100%}
.id-thumb svg.over{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.swatch{display:block;width:100%;height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(38,40,42,.35),0 6px 18px rgba(20,30,30,.18)}
.ref-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.swatch-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.cands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.cand{background:none;border:1px solid rgba(38,40,42,.3);border-radius:3px;padding:8px 8px 10px;cursor:pointer;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s,transform .2s;min-height:44px}
.cand:hover{border-color:var(--ink);transform:translateY(-2px)}
.cand .swatch{box-shadow:0 0 0 1px rgba(38,40,42,.25)}
.cand-name{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.cand.right{border-color:#2c6356;background:rgba(44,99,86,.08)}
.cand.wrong{border-color:var(--coral-ink);background:rgba(210,112,90,.07)}
.verdict{margin-top:14px;font-size:16px;line-height:1.5;color:var(--ink-2);min-height:4.5em}
.verdict strong{font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--ink);display:block;margin-bottom:2px}
.id-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* ---------- Scene 5 ---------- */
.grid-map{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(14px,2vw,24px);align-items:start}
.map-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.map-svg{display:block;width:100%;min-width:680px;height:auto}
.facts-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px clamp(18px,3vw,40px)}
.map-key{display:grid;gap:6px;font-size:13px;color:var(--ink-3);margin-top:8px}

function stem(w){w=w.toLowerCase();if(w.length>5&&w.endsWith("ing"))w=w.slice(0,-3);else if(w.length>4&&w.endsWith("ies"))w=w.slice(0,-3)+"y";else if(w.length>3&&w.endsWith("s")&&!w.endsWith("ss"))w=w.slice(0,-1);return w;}
function toks(s){return (s.toLowerCase().match(/[a-z']+/g)||[]).map(w=>w.replace(/'s?$/,"")).filter(w=>w&&!STOP.has(w)).map(stem);}
const KB_INDEX=KB.map(e=>({e,kw:new Map(e.kw.map(k=>{const [w,wt]=k.split(":");return [stem(w),wt?parseFloat(wt):1];})),qt:new Set(toks(e.q))}));
function retrieve(query){
  const q=[...new Set(toks(query))];
  if(!q.length) return null;
  let best=null;
  for(const it of KB_INDEX){
    let s=0; const hits=[];
    for(const t of q){ if(it.kw.has(t)){s+=it.kw.get(t);hits.push(t);} else if(it.qt.has(t)){s+=.5;hits.push(t);} }
    if(!best||s>best.score) best={entry:it.e,score:s,hits};
  }
  return best&&best.score>=1?best:null;
}

function interp(pts,x){if(x<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return y0+(y1-y0)*(x-x0)/(x1-x0);}}return pts[pts.length-1][1];}

function makePattern(){
  const r=rng(20240601); const head=[],body=[],stripes=[]; const fins={d1:[],pec:[],tail:[]};
  for(let t=0;t<4000&&head.length<150;t++){
    const x=66+r()*262, top=interp(TOPL,x)+5, bot=interp(CSL,x)-2; if(bot<=top) continue;
    const y=top+r()*(bot-top);
    if(Math.hypot(x-138,y-229)<12) continue; if(x<128&&y>230) continue;
    if(x>228&&GILL_X.some(g=>Math.abs(x-g)<4)) continue;
    const rad=1.5+r()*1.5+(x-66)/262*.9;
    if(head.every(s=>Math.hypot(s[0]-x,s[1]-y)>s[2]+rad+3.2)) head.push([x,y,rad]);
  }
  for(let k=0;k<19;k++){
    const x0=334+k*32.5, top=interp(TOPL,x0)+4, bot=interp(CSL,x0)+4, wob=(r()-.5)*6;

    for(const off of [10.5,21.5]){

    }
  }
  const scatter=(arr,x0,x1,y0,y1,n,a,b,md)=>{for(let t=0;t<n*60&&arr.length<n;t++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0),rad=a+r()*(b-a);if(arr.every(s=>Math.hypot(s[0]-x,s[1]-y)>md))arr.push([x,y,rad]);}};

function Particles({reduced,density=60,color="222,238,232",seed=5}){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current; if(!cv) return; const ctx=cv.getContext("2d"); let w=0,h=0,raf=0; const R=rng(seed); let ps=[];
    const draw=t=>{ctx.clearRect(0,0,w,h);ctx.fillStyle="rgb("+color+")";for(const p of ps){ctx.globalAlpha=p.a;ctx.beginPath();ctx.arc(p.x+Math.sin(t/2600+p.ph)*7*p.sw,p.y,p.r,0,6.283);ctx.fill();}};
    const fit=()=>{const dpr=Math.min(2,window.devicePixelRatio||1);w=cv.clientWidth;h=cv.clientHeight;if(!w||!h)return;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const n=Math.round(density*Math.min(1.6,Math.max(.4,(w*h)/(1200*800))));ps=Array.from({length:n},()=>({x:R()*w,y:R()*h,r:.5+R()*1.6,a:.1+R()*.38,vy:.06+R()*.2,ph:R()*6.28,sw:.2+R()*.6}));draw(0);};
    const loop=t=>{for(const p of ps){p.y+=p.vy;if(p.y>h+4){p.y=-4;p.x=R()*w;}}draw(t);raf=requestAnimationFrame(loop);};
    fit(); window.addEventListener("resize",fit); if(!reduced) raf=requestAnimationFrame(loop);
    return ()=>{cancelAnimationFrame(raf);window.removeEventListener("resize",fit);};
  },[reduced,density,color,seed]);

function FeedingDemo({reduced,onCite}){

    for(let i=0;i<=40;i++){const t=i/40;lower.push([cub(70,95,160,250,t),cub(190,215,238,244,t)]);}
    for(let i=1;i<=40;i++){const t=i/40;lower.push([cub(250,350,450,560,t),cub(244,250,250,246,t)]);}
    const SL=[372,392,412,432,452];

    const arrow=(x1,y1,x2,y2,col)=>{ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.4),y2-9*Math.sin(a-.4));ctx.lineTo(x2-9*Math.cos(a+.4),y2-9*Math.sin(a+.4));ctx.closePath();ctx.fill();};
    const label=(t,x,y,col)=>{ctx.fillStyle=col||"#47463f";ctx.font="600 19px Caveat, 'Segoe Print', cursive";ctx.fillText(t,x,y);};

      if(R()<.6){const p=R()<.17;parts.push({p,x:-6-R()*20,y:118+R()*66,vx:1.3+R()*.5,gx:SL[Math.floor(R()*5)],a:1});}

      for(let i=gulp.length-1;i>=0;i--){const g=gulp[i];if(g.ph===0){g.x+=(356-g.x)*.12+.4;g.y+=(152-g.y)*.12;if(Math.abs(g.y-152)<3&&g.x>350)g.ph=1;}else{g.x+=2.2;g.y+=(152-g.y)*.2;if(g.x>556){gulp.splice(i,1);eaten++;}}}

function genSwatch(seed,n,stripes){
  const r=rng(seed); const pts=[];
  for(let t=0;t<4000&&pts.length<n;t++){
    const p=[14+r()*80,5+r()*50,1.3+r()*1.4];
    if(stripes.some(s=>Math.abs(p[0]-s-p[1]*.04)<2.6)) continue;
    if(Math.abs(p[1]-17)<2.4) continue;
    if(pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>8.5)) pts.push(p);
  }
  return pts;
}

const OTHER=genSwatch(203,17,OTHER_STRIPES);
const TRIS=[[0,2,5],[2,5,9],[5,9,13],[1,6,10],[9,13,15]].filter(t=>t.every(i=>i<REF.length&&!DROP.has(i)));

      <path d="M-10,${ridge} C20,${ridge-2} 70,${ridge+1} 120,${ridge-1}" stroke="#d4e5df" strokeWidth=".9" opacity=".55" fill="none"/>
      ${stripes.map((s,i)=>html`<path key=${i} d=${"M"+s+",-10 L"+(s+2.8)+",70"} stroke="#dfe9e1" strokeWidth="1.1" opacity=".65"/>`)}

      ${tris&&tris.map((t,i)=>html`<polygon key=${"t"+i} points=${t.map(k=>f1(REF[k][0])+","+f1(REF[k][1])).join(" ")} fill="rgba(232,198,127,.14)" stroke="#e8c67f" strokeWidth=".6" strokeLinejoin="round"/>`)}

}

function SceneProtect({reduced,onCite,onAsk}){
  return html`<section className="scene s5" aria-labelledby="s5-title">

    <div className="scene-inner">
      <article className="page on-paper">
        <header className="page-head">
          <div><p className="kicker">Chapter 4 · The evidence</p><h2 id="s5-title" tabIndex="-1">Science, mystery and protection</h2></div>
          <span className="folio">What is known, what is not, what helps</span>
        </header>
        <div className="grid-map">
          <figure style=${{margin:0}}>
            <div className="map-scroll"><${FieldMap}/></div>
            <figcaption className="map-key">
              <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#d2705a" stroke="#26282a"/></svg>Documented aggregation site <${Cite} ids=${SITE_SRC} onCite=${onCite}/></span>

              <span><${Tag} kind="illus">Coastlines simplified by hand<//></span>
            </figcaption>
          </figure>
          <div>
            <div className="ask-cta">
              <button type="button" className="btn btn-primary" onClick=${onAsk}>Ask the Field Journal</button>
              <span className="hand" style=${{fontSize:"20px",color:"var(--teal-ink)"}}>questions answered from cited notes</span>
            </div>
            <ul className="facts facts-grid">
              <li><${Tag} kind="doc">Documented<//><h3>Ocean-crossing journeys</h3><p>A 7 m female tagged off Coiba Island, Panama, was tracked for 841 days over about 20,142 km, ending near the Mariana Trench. <${Cite} ids=${["guzman"]} onCite=${onCite}/></p></li>
              <li><${Tag} kind="open">Open question<//><h3>Where are pups born?</h3><p>Much about newborn and adult whale sharks is still unknown. At Darwin Island, Galápagos, over 90% of sharks recorded were adult females, almost all possibly pregnant, yet where they give birth has not been found. <${Cite} ids=${["rowat","acuna"]} onCite=${onCite}/></p></li>
              <li><${Tag} kind="assess">Assessed<//><h3>Endangered</h3><p>Classed as Endangered by the IUCN Red List in 2016, which estimated the global population had more than halved over about 75 years. IUCN published an updated assessment in 2025. <${Cite} ids=${["iucn","iucn25"]} onCite=${onCite}/></p></li>
              <li><${Tag} kind="doc">Documented<//><h3>Nets and ships</h3><p>Fishing and ship strikes are the main threats. Satellite tracking found that 92% of the sharks’ horizontal space use overlapped with large-vessel traffic, and fatal strikes may go largely undetected. <${Cite} ids=${["iucn","womersley"]} onCite=${onCite}/></p></li>
            </ul>
          </div>
        </div>
        <section className="help" aria-labelledby="help-t">
          <div className="help-head"><h3 id="help-t">Three ways to help</h3><span className="folio">Credible, practical actions</span></div>
          <ul className="actions">
            <li><b>Swim with care</b><p>Choose operators that follow local rules. At Ningaloo, swimmers stay at least 3 m from the head and body and 4 m from the tail, and never touch or use flash. <${Cite} ids=${["code"]} onCite=${onCite}/></p></li>
            <li><b>Share your photos</b><p>Upload encounter photos, especially the left side behind the gills, to the Sharkbook photo-ID library so researchers can follow individuals. <${Cite} ids=${["sharkbook"]} onCite=${onCite}/></p></li>
            <li><b>Back protections that work</b><p>Support science-based measures that reduce ship strikes and bycatch in the places whale sharks gather. <${Cite} ids=${["womersley","iucn"]} onCite=${onCite}/></p></li>
          </ul>
        </section>
      </article>
    </div>
  </section>`;

   Drawers
   ========================================================= */
function useDialog(onClose){
  const ref=useRef(null);
  useEffect(()=>{
    const prev=document.activeElement; const el=ref.current;
    const first=el&&el.querySelector("button, [href], input");
    first&&first.focus();
    const onKey=e=>{
      if(e.key==="Escape"){e.stopPropagation();onClose();}
      if(e.key==="Tab"&&el){const f=[...el.querySelectorAll("button, [href], input")].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],b=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus();}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus();}}
    };
    document.addEventListener("keydown",onKey,true);
    return ()=>{document.removeEventListener("keydown",onKey,true);prev&&prev.focus&&prev.focus();};
  },[]);
  return ref;
}
function Drawer({title,kicker,onClose,children,id}){
  const ref=useDialog(onClose);
  return html`<${Fragment}>
    <div className="scrim" onClick=${onClose}></div>
    <div className="drawer" role="dialog" aria-modal="true" aria-labelledby=${id+"-t"} ref=${ref}>
      <div className="drawer-head">
        <div><p className="kicker">${kicker}</p><h2 id=${id+"-t"}>${title}</h2></div>
        <button type="button" className="btn" onClick=${onClose} aria-label="Close panel">Close</button>
      </div>
      ${children}
    </div>
  <//>`;
}
function SourcesPanel({focus,onClose}){
  useEffect(()=>{if(!focus)return;const el=document.getElementById("src-"+focus);el&&el.scrollIntoView({block:"center"});},[focus]);
  return html`<${Drawer} id="src" kicker="Researched, then independently checked" title="Scientific sources" onClose=${onClose}>
    <p>Every factual statement in this volume links to one of these works. Illustrations and animation are artistic and are labeled as such.</p>
    <ol className="srcs">
      ${SOURCE_ORDER.map(k=>{const s=SOURCES[k];return html`<li key=${k} id=${"src-"+k} className=${focus===k?"hl":""}>
        <p className="src-title">${s.title}</p>
        <p className="src-meta">${s.authors} (${s.year}). ${s.pub}.</p>
        <a className="src-link" href=${s.link} target="_blank" rel="noopener noreferrer">${s.linkText}</a>
        <p className="src-used">Used in: ${s.used}</p>
      </li>`;})}
    </ol>
  <//>`;
}
function AskPanel({onClose,onCite,state,setState}){
  const ask=(text,fromChip)=>{const hit=retrieve(text);setState({q:text,hit,chip:fromChip||null,input:state.input});};
  const byId=id=>KB.find(e=>e.id===id);
  return html`<${Drawer} id="ask" kicker="Prototype · local research assistant" title="Ask the Field Journal" onClose=${onClose}>
    <p>This is not a live AI model. It matches your question against ${KB.length} verified notes stored in this page, answers only from them, and cites the source. If no note fits, it says so. No data leaves your device.</p>
    <div className="chips" role="group" aria-label="Suggested questions">
      ${FEATURED_Q.map(id=>{const e=byId(id);return html`<button key=${id} type="button" className="chip" aria-pressed=${state.chip===id} onClick=${()=>ask(e.q,id)}>${e.q}</button>`;})}
      <button type="button" className="chip test" aria-pressed=${state.chip==="sleep"} onClick=${()=>ask("Do whale sharks sleep?","sleep")}>Do whale sharks sleep?</button>
    </div>
    <form className="askform" onSubmit=${e=>{e.preventDefault();if(state.input.trim())ask(state.input.trim());}}>
      <label htmlFor="ask-input">Ask your own question</label>
      <input id="ask-input" type="text" autoComplete="off" placeholder="Ask your own question" value=${state.input} onInput=${e=>setState(s=>({...s,input:e.target.value}))}/>
      <button type="submit" className="btn btn-primary">Ask</button>
    </form>
    <div aria-live="polite">
      ${state.q&&(state.hit?html`<article className="answer">
        <p className="q">${state.q}</p>
        <p className="a">${state.hit.entry.a}</p>
        <p style=${{margin:"0 0 6px"}}>Sources: <${Cite} ids=${state.hit.entry.src} onCite=${onCite}/></p>
        <p className="meta">Retrieved note: “${state.hit.entry.q}” · matched on: ${state.hit.hits.join(", ")}</p>
      </article>`:html`<article className="answer none">
        <p className="q">${state.q}</p>
        <p className="a">The field journal has no verified note that answers this yet, so it won’t guess.</p>
        <p className="meta">Try a suggested question, or browse the sources. Other topics it can answer: size, age, eyes, reproduction, status, identification.</p>
      </article>`)}
    </div>
    <p className="small-print" style=${{marginTop:"18px"}}>How it works: your question is split into keywords, compared with each note’s keyword list, and the best-matching note is returned only if the match is strong enough. A future version could use a small language model restricted to these same cited notes.</p>
  <//>`;
}
function ConceptPanel({onClose,onSources}){
  return html`<${Drawer} id="concept" kicker="Field Notes From the Blue" title="The concept" onClose=${onClose}>
    <p>An expandable collection of short, interactive documentaries about sea animals. Each volume follows the same six chapters:</p>
    <ol className="concept-list">

      <li><b>The encounter</b>: a full-scale illustrated portrait with scale references.</li>
      <li><b>The plate</b>: interactive anatomy and one behaviour, modelled.</li>
      <li><b>Field science</b>: a hands-on version of a real research method.</li>

/* =========================================================
   App
   ========================================================= */
const SCENES=[
 {short:"Journal",title:"Open the field journal"},
 {short:"Gentle giant",title:"Meet a gentle giant"},
 {short:"Anatomy",title:"Anatomy and filter feeding"},
 {short:"Constellation",title:"A living constellation"},
 {short:"Evidence",title:"Science, mystery and protection"},
 {short:"Collection",title:"The collection expands"}
];
function usePrefersReduced(){
  const get=()=>{try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}};
  const [r,setR]=useState(get);
  useEffect(()=>{let m;try{m=window.matchMedia("(prefers-reduced-motion: reduce)");}catch(e){return;}const f=()=>setR(m.matches);m.addEventListener?m.addEventListener("change",f):m.addListener(f);return()=>{m.removeEventListener?m.removeEventListener("change",f):m.removeListener(f);};},[]);
  return r;
}
function App(){
  const sys=usePrefersReduced();
  const [motionPref,setMotionPref]=useState(null);
  const reduced=motionPref===null?sys:motionPref==="off";
  const [scene,setScene]=useState(0);
  const [dir,setDir]=useState(1);
  const [opening,setOpening]=useState(false);
  const [dive,setDive]=useState(false);
  const [drawer,setDrawer]=useState(null);
  const [srcFocus,setSrcFocus]=useState(null);
  const [scaleOn,setScaleOn]=useState(false);
  const [hot,setHot]=useState("spots");
  const [choice,setChoice]=useState(null);
  const [tri,setTri]=useState(false);
  const [sel,setSel]=useState(null);
  const [gh,setGh]=useState(false);
  const [ask,setAsk]=useState({q:"",hit:null,chip:null,input:""});
  const [announce,setAnnounce]=useState("");
  const timers=useRef([]);
  const busy=useRef(false);

  const goTo=useCallback((n)=>{
    if(n<0||n>5||busy.current) return;
    setScene(cur=>{
      if(n===cur) return cur;
      setDir(n>cur?1:-1);
      if(cur===0&&n===1&&!reduced){
        busy.current=true; setOpening(true);
        timers.current.push(setTimeout(()=>setDive(true),650));
        timers.current.push(setTimeout(()=>{setScene(1);setOpening(false);},1250));
        timers.current.push(setTimeout(()=>{setDive(false);busy.current=false;},2000));
        return cur;
      }
      return n;
    });
  },[reduced]);
  useEffect(()=>()=>timers.current.forEach(clearTimeout),[]);
  useEffect(()=>{
    setAnnounce("Chapter "+(scene+1)+" of 6: "+SCENES[scene].title);
    const t=setTimeout(()=>{const h=document.querySelector(".scene h2[tabindex='-1'], .scene h1");if(h&&scene>0)h.focus({preventScroll:true});},60);
    return ()=>clearTimeout(t);
  },[scene]);
  useEffect(()=>{
    const onKey=e=>{
      if(drawer) return;
      const tag=(e.target&&e.target.tagName)||"";
      if(/INPUT|TEXTAREA|SELECT/.test(tag)||e.altKey||e.ctrlKey||e.metaKey) return;
      if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();goTo(scene+1);}
      if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();goTo(scene-1);}
    };
    window.addEventListener("keydown",onKey); return ()=>window.removeEventListener("keydown",onKey);
  },[scene,drawer,goTo]);

  const onCite=useCallback(id=>{setSrcFocus(id);setDrawer("sources");},[]);
  const nextVolume=()=>{const i=FUTURE.findIndex(v=>v.id===sel);setSel(FUTURE[(i+1)%FUTURE.length].id);};
  const explore=()=>{
    switch(scene){
      case 0: goTo(1); break;
      case 1: setScaleOn(s=>!s); break;
      case 2: {const i=HOTSPOTS.findIndex(h=>h.id===hot);setHot(HOTSPOTS[(i+1)%HOTSPOTS.length].id);break;}
      case 3: if(choice&&CANDS.find(c=>c.id===choice).right){setTri(t=>!t);}else{const el=document.getElementById("cand-A");el&&el.focus();el&&el.scrollIntoView({block:"center",behavior:reduced?"auto":"smooth"});} break;
      case 4: setDrawer("ask"); break;
      case 5: nextVolume(); break;
    }
  };
  const solved=choice&&CANDS.find(c=>c.id===choice).right;
  const exploreLabel=[
    "Open the journal",
    scaleOn?"Hide scale":"Compare scale",
    "Next hotspot",
    solved?(tri?"Hide triangles":"Show triangles"):"Try the match",
    "Ask the Field Journal",
    "Imagine the next volume"
  ][scene];
  const exploreShort=["Open","Scale","Next hotspot",solved?"Triangles":"Try match","Ask","Next volume"][scene];

  let body=null;
  const cls="k"+scene;
  if(scene===0) body=html`<${SceneJournal} key=${cls} reduced=${reduced} opening=${opening} onOpen=${()=>goTo(1)}/>`;
  if(scene===1) body=html`<${SceneGiant} key=${cls} reduced=${reduced} scaleOn=${scaleOn} onScale=${()=>setScaleOn(s=>!s)} onCite=${onCite}/>`;
  if(scene===2) body=html`<${SceneAnatomy} key=${cls} reduced=${reduced} hot=${hot} setHot=${setHot} onCite=${onCite}/>`;
  if(scene===3) body=html`<${SceneConstellation} key=${cls} reduced=${reduced} choice=${choice} setChoice=${c=>{setChoice(c);if(c&&CANDS.find(x=>x.id===c).right)setTri(true);}} tri=${tri} setTri=${setTri} onCite=${onCite}/>`;
  if(scene===4) body=html`<${SceneProtect} key=${cls} reduced=${reduced} onCite=${onCite} onAsk=${()=>setDrawer("ask")}/>`;
  if(scene===5) body=html`<${SceneCollection} key=${cls} reduced=${reduced} sel=${sel} setSel=${setSel} gh=${gh} setGh=${setGh} onConcept=${()=>setDrawer("concept")} onSources=${()=>{setSrcFocus(null);setDrawer("sources");}} onNext=${nextVolume}/>`;

  return html`<div className=${"app"+(reduced?" rm":"")+(scene===0?" chrome-light":"")+(dir<0?" going-back":"")}>
    <${SharedDefs}/>
    <header className="topbar">
      <div className="wordmark"><b>Field Notes From the Blue</b><small>Vol. I · Whale Sharks</small></div>
      <div className="tools">
        <button type="button" className="btn" onClick=${()=>setDrawer("ask")}><span className="lbl-long">Ask the Field Journal</span><span className="lbl-short">Ask</span></button>
        <button type="button" className="btn" onClick=${()=>{setSrcFocus(null);setDrawer("sources");}}>Sources</button>
        <button type="button" className="btn" aria-pressed=${reduced} onClick=${()=>setMotionPref(reduced?"on":"off")} title="Turn animation on or off">
          <span className="lbl-long">${reduced?"Motion off":"Motion on"}</span><span className="lbl-short">${reduced?"Still":"Motion"}</span>
        </button>
      </div>
    </header>
    <main className="stage" aria-label="Documentary">
      <div className=${dir<0?"dirback":""} style=${{position:"absolute",inset:0}}>${body}</div>
    </main>
    ${dive&&html`<div className="dive" aria-hidden="true">${[12,26,41,57,70,84,91].map((l,i)=>html`<i key=${i} style=${{left:l+"%",animationDelay:(i*.07)+"s",width:(6+i%3*4)+"px",height:(6+i%3*4)+"px"}}></i>`)}</div>`}
    <nav className="dock" aria-label="Chapters">
      <div className="progress">
        <ol>
          ${SCENES.map((s,i)=>html`<li key=${i}><button type="button" className=${"seg"+(i<scene?" done":"")+(i===scene?" current":"")} aria-current=${i===scene?"step":undefined} aria-label=${"Chapter "+(i+1)+": "+s.title} onClick=${()=>goTo(i)}><span></span></button></li>`)}
        </ol>
        <span className="progress-label"><b>${scene+1} / 6</b> · <span className="lbl-long">${SCENES[scene].title}</span><span className="lbl-short">${SCENES[scene].short}</span></span>
        ${scene<5&&html`<button type="button" className="linkbtn" onClick=${()=>goTo(5)}>Skip to overview</button>`}
      </div>
      <div className="navrow">
        <button type="button" className="btn btn-nav" onClick=${()=>goTo(scene-1)} disabled=${scene===0}>← Back</button>
        <button type="button" className="btn btn-explore" onClick=${explore}><span className="lbl-long">Explore · ${exploreLabel}</span><span className="lbl-short">${exploreShort}</span></button>
        ${scene<5?html`<button type="button" className="btn btn-primary btn-nav" onClick=${()=>goTo(scene+1)}>Next →</button>`:html`<button type="button" className="btn btn-primary btn-nav" onClick=${()=>{setScene(0);setDir(-1);}}>Start again</button>`}
        <span className="keyhint" aria-hidden="true">← → keys</span>
      </div>
    </nav>
    <p className="vh" aria-live="polite">${announce}</p>
    ${drawer==="sources"&&html`<${SourcesPanel} focus=${srcFocus} onClose=${()=>setDrawer(null)}/>`}
    ${drawer==="ask"&&html`<${AskPanel} onClose=${()=>setDrawer(null)} onCite=${onCite} state=${ask} setState=${setAsk}/>`}
    ${drawer==="concept"&&html`<${ConceptPanel} onClose=${()=>setDrawer(null)} onSources=${()=>{setSrcFocus(null);setDrawer("sources");}}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
})();
</script>

</body>
</html>
